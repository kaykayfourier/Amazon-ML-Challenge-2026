[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["ipykernel", "jupyter"]

[tool.setuptools]
packages = ["src", "src.normalization_layer"]
